[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pr-review-agent"
version = "0.1.0"
description = "Terminal CLI that reviews a pull request with an OMP agent following the pr-review skill"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "omp-rpc @ git+https://github.com/can1357/oh-my-pi@v18.13.2#subdirectory=sdk/python/omp-rpc",
]

[project.scripts]
pr-review = "pr_review_agent.cli:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/pr_review_agent"]

[tool.hatch.build.targets.wheel.force-include]
"Skills/pr-review/SKILL.md" = "pr_review_agent/skills/pr-review/SKILL.md"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
